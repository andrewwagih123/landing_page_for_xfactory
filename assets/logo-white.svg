<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer Circle Border -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#f8fafc" stroke-width="16" />

  <!-- Center Geometric X Emblem -->
  <g transform="translate(250, 185)" fill="#f8fafc" stroke="#f8fafc" stroke-linejoin="round">
    <rect x="-42" y="-42" width="84" height="84" fill="#38bdf8" opacity="0.25" rx="4" />
    
    <!-- Bold X main limbs -->
    <polygon points="-75,-78 -22,-78 75,78 22,78" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <polygon points="75,-78 22,-78 -75,78 -22,78" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    
    <!-- Top & bottom chevron caps -->
    <polygon points="-82,-86 -25,-86 0,-52 25,-86 82,-86 52,-42 0,-10 -52,-42" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <polygon points="-82,86 -25,86 0,52 25,86 82,86 52,42 0,10 -52,42" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>

    <!-- Inner dimensional accent lines -->
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#0f172a" stroke-width="2.5" />
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#0f172a" stroke-width="2.5" />
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Brand Typography: XFACTORY -->
  <text x="250" y="340" 
        text-anchor="middle" 
        font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#f8fafc">XFACTORY</text>

  <!-- Subtitle: • CLOTHING STORE • -->
  <text x="250" y="380" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#f8fafc">• CLOTHING STORE •</text>

  <!-- EST. 2023 -->
  <text x="250" y="416" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#94a3b8">EST. 2023</text>
</svg>